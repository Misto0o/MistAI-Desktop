name: Build and Release MistAI Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    # MistAI V2 deliberately uses Windows UI Automation, Win32 window APIs,
    # and the Windows registry. README documents Windows as the supported
    # release platform; publishing macOS/Linux artifacts from this code would
    # be misleading and the old jobs could not build a usable application.
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipwin
          pipwin install pyaudio
          if (-not (python -c "import pyaudio" 2>$null)) {
            python -m pip install pyaudio
          }
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Install bundled Playwright Firefox
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install firefox

      - name: Verify release inputs
        shell: pwsh
        run: |
          $required = @("assistant.py", "core/api.py", "core/agent.py", "ui/html.py", "splash.png", "MistAI.spec")
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required release input missing: $path" }
          }
          git ls-files --error-unmatch core/api.py core/agent.py ui/html.py | Out-Null
          python -m compileall -q core ui assistant.py
          python -c "import core.agent, core.api, core.executor, core.planner; print('V2 imports: OK')"

      - name: Run focused tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m PyInstaller MistAI.spec --clean --noconfirm

      - name: Package artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MistAI.exe")) { throw "Build failed: dist/MistAI.exe not found" }
          Compress-Archive -Path dist/MistAI.exe -DestinationPath dist/MistAI-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MistAI-Windows
          path: dist/MistAI-Windows-x64.zip

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: MistAI-Windows
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/MistAI-Windows-x64.zip
          generate_release_notes: true
          body: |
            ## MistAI Desktop ${{ github.ref_name }}

            Windows 10/11 (64-bit) release. Extract `MistAI-Windows-x64.zip`
            and run `MistAI.exe`.
